name: Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - released
      - prereleased
      - edited

permissions:
  contents: write
  packages: write

jobs:
  config:
    uses: now-start/gitops/.github/workflows/reusable-java-app.yaml@main
    with:
      module: config
      shared-coverage: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  eureka:
    uses: now-start/gitops/.github/workflows/reusable-java-app.yaml@main
    with:
      module: eureka
      shared-coverage: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  admin:
    uses: now-start/gitops/.github/workflows/reusable-java-app.yaml@main
    with:
      module: admin
      shared-coverage: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  gateway:
    uses: now-start/gitops/.github/workflows/reusable-java-app.yaml@main
    with:
      module: gateway
      shared-coverage: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
