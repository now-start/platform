name: Config Refresh

on:
  push:
    branches: [main]
    paths:
      - 'config/src/main/resources/config/**'

jobs:
  refresh-config:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Bus Refresh
        env:
          CONFIG_REFRESH_URL: ${{ secrets.CONFIG_REFRESH_URL }}
          CONFIG_REFRESH_USERNAME: ${{ secrets.CONFIG_REFRESH_USERNAME }}
          CONFIG_REFRESH_PASSWORD: ${{ secrets.CONFIG_REFRESH_PASSWORD }}
        run: |
          if [ -z "$CONFIG_REFRESH_URL" ]; then
            echo "CONFIG_REFRESH_URL secret is required"
            exit 1
          fi

          if [ -z "$CONFIG_REFRESH_USERNAME" ] || [ -z "$CONFIG_REFRESH_PASSWORD" ]; then
            echo "CONFIG_REFRESH_USERNAME and CONFIG_REFRESH_PASSWORD secrets are required"
            exit 1
          fi

          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -u "$CONFIG_REFRESH_USERNAME:$CONFIG_REFRESH_PASSWORD" \
            -X POST "$CONFIG_REFRESH_URL" \
            --connect-timeout 5 \
            --max-time 15)

          case "$STATUS" in
            200|204)
              echo "Config refresh triggered (status=$STATUS)"
              exit 0
              ;;
            *)
              echo "Config refresh failed (status=$STATUS)"
              exit 1
              ;;
          esac
