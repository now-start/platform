spring:
  cloud:
    decrypt-environment-post-processor:
      enabled: false
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
    config:
      enabled: false
    bus:
      enabled: false
  security:
    user:
      name: "basic-user"
      password: "{noop}basic-secret"
      roles:
        - "ADMINISTRATORS"
    oauth2:
      client:
        registration:
          test:
            client-id: "test-id"
            client-secret: "test-secret"
            authorization-grant-type: "authorization_code"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          test:
            authorization-uri: "http://localhost:9999/oauth/authorize"
            token-uri: "http://localhost:9999/oauth/token"
            jwk-set-uri: "http://localhost:9999/oauth/jwks"
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9999"

eureka:
  client:
    enabled: false

security:
  users:
    - "/*/v3/api-docs"
    - "/admin/applications"
    - "/admin/wallboard"
    - "/admin/journal"
    - "/admin/external"
  publicPaths:
    - "/config/actuator/busrefresh"
    - "/*/actuator/**"
    - "/actuator/**"
    - "/nyang-nyang-bot/**"
