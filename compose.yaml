services:
  config:
    user: root
    restart: always
    image: ghcr.io/now-start/config:latest
    volumes:
      - ./logs:/workspace/logs
    environment:
      TZ: "Asia/Seoul"
      ENCRYPT_KEY: "${ENCRYPT_KEY}"

  eureka:
    user: root
    restart: always
    image: ghcr.io/now-start/eureka:latest
    volumes:
      - ./logs:/workspace/logs
    environment:
      TZ: "Asia/Seoul"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config:8888"
    depends_on:
      - config

  admin:
    user: root
    restart: always
    image: ghcr.io/now-start/admin:latest
    volumes:
      - ./logs:/workspace/logs
    environment:
      TZ: "Asia/Seoul"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config:8888"
    depends_on:
      - config
      - eureka

  gateway:
    user: root
    restart: always
    image: ghcr.io/now-start/gateway:latest
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/workspace/logs
    environment:
      TZ: "Asia/Seoul"
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=256m"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config:8888"
      SPRING_DATA_REDIS_HOST: "${REDIS_HOST:?REDIS_HOST is required}"
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      SPRING_SESSION_DATA_REDIS_NAMESPACE: "${GATEWAY_SESSION_NAMESPACE:-nowstart:gateway:session}"
    depends_on:
      - config
      - eureka
