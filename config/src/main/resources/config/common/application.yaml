      endpoint: '{cipher}0c1ba71e78b809e8ef24e132beb02fce505e327046a8a8df0def7f654a8deb10085b2cdbafe37a57c514dcd47023117a'

logging:
  charset:
    file: UTF-8
  file:
    path: ./logs
  logback:
    rollingpolicy:
      max-history: 7