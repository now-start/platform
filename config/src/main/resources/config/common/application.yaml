server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  cloud:
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  jmx:
    enabled: true

encrypt:
  key: '{cipher}27c52131842a4d1aa2fe34746cb0afed88c973d4e7dab7c55dacea98f1619c93'

eureka:
  instance:
    metadata-map:
      management.port: ${management.server.port}
  client:
    service-url:
      defaultZone: '{cipher}a891dcd1f6ebdc5060c90297d04af450c87fc4364e030e48fa1417e1f0b5e50d045680f95d49b4f54e7a6477afa4c66cdfba7b4370e9e93d4c6472561988e6b42ed7fdbcf4d8630c2a5f1ab4395f277a5d9aa456acaa58fdc385c1050f7724ef05de69a1b94e2bb52d9f1bbae2a1418bf95d779b61f1ae3b1293cc3edb35808a'

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"
    access:
      default: unrestricted
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
  info:
    os:
      enabled: true
    java:
      enabled: true
    process:
      enabled: true

otel:
  exporter:
