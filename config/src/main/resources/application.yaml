spring.config.import: optional:classpath:config/common/application.yaml

---

server:
  port: 8888

spring:
  application:
    name: config
  cloud:
    config:
      server:
        git:
          uri: https://github.com/now-start/platform
          # 복수 서비스 조회에서도 요청 이름의 순서대로 검색 폴더가 바뀌지 않게 한다.
          search-paths: config/src/main/resources/config/*

encrypt:
  key: ${ENCRYPT_KEY}
